[project]
name = "kancha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    # RAG vector store: the default "sqlite" backend needs only aiosqlite +
    # numpy (both already here). chromadb is an OPTIONAL alternative backend
    # — install it and set KANCHA_RAG_VECTOR_STORE=chroma to switch.
    # "chromadb>=0.5.5",
    # Local, offline TTS (output/tts.py) — replaces the network-bound
    # edge-tts. Model files go in tts/data/ (see KANCHA_TTS_MODEL_DIR).
    "kokoro-onnx>=0.5.0",
    "onnxruntime>=1.17.0",
    "elevenlabs>=2.52.0",
    "fastapi>=0.140.0",
    "google-genai>=2.6.0",
    "groq>=0.4.0",
    "httpx>=0.27.0",
    "keyring>=25.7.0",
    "numpy>=2.4.6",
    # RAG embeddings: the default "gemini" provider reuses google-genai and
    # the existing key pool. The "ollama" provider talks to a local daemon
    # over httpx, so the ollama package is not required for it either.
    # "ollama>=0.4.0",
    "openwakeword>=0.4.0",
    "playwright>=1.61.0",
    "pyaudio>=0.2.14",
    "pyautogui>=0.9.54",
    "psutil>=6.0.0",
    "pynvml>=0.2",
    "pydantic>=2.0.0",
    # RAG document loaders.
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    # Required by FastAPI to parse multipart uploads (POST /api/rag/upload).
    "python-multipart>=0.0.9",
    "sounddevice>=0.5.5",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.0",
    "argparse>=1.4.0",
    "yt-dlp>=2026.7.4",
    "send2trash>=2.1.0",
    "deepgram-sdk>=7.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
